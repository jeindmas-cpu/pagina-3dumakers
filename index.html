<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>3DUMAKERS</title>
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gris: #f2f2f2;
            --gris-borde: #bdbdbd;
            --amarillo: #ffe066;
            --azul-oscuro: #1a237e;
        }

        html,
        body,
        header,
        .container,
        footer,
        form,
        label,
        input,
        textarea,
        button,
        div,
        p,
        strong,
        b {
            font-family: 'Poppins', Arial, sans-serif !important;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--gris);
            color: var(--azul-oscuro);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: stretch;
            width: 100vw;
        }

        header,
        .container,
        footer {
            margin-left: auto;
            margin-right: auto;
            text-align: center;
        }

        header {
            background: var(--amarillo);
            border-bottom: 4px solid var(--azul-oscuro);
            width: 100%;
            padding-bottom: 10px;
        }

        header h1 {
            font-size: 3em;
            color: var(--azul-oscuro);
        }

        header p {
            font-size: 1.3em;
            color: var(--azul-oscuro);
        }

        .container {
            width: 100vw;
            max-width: 100vw;
            margin: 0;
            padding: 40px 0;
            background: #fff;
            border-radius: 0;
            border: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: calc(100vh - 120px);
            /* Ajusta según header/footer */
        }

        .container img {
            max-width: 220px;
            height: auto;
            margin-bottom: 25px;
        }

        form {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label,
        input[type="file"],
        input[type="text"],
        textarea,
        button {
            width: 80%;
            max-width: 600px;
            font-size: 1.1em;
            text-align: left;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 18px;
            font-size: 1.2em;
            letter-spacing: 1px;
            color: var(--azul-oscuro);
            text-align: left;
        }

        input[type="file"] {
            padding: 14px;
            margin-top: 8px;
            border: 2px solid var(--gris-borde);
            border-radius: 10px;
            font-size: 1.1em;
            background: var(--amarillo);
            color: var(--azul-oscuro);
            cursor: pointer;
        }

        input[type="text"],
        input[type="email"],
        textarea {
            padding: 12px;
            margin-top: 8px;
            border: 1.5px solid var(--gris-borde);
            border-radius: 8px;
            background: var(--gris);
            font-size: 1.1em;
            transition: border-color 0.2s;
            color: var(--azul-oscuro);
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        button {
            margin-top: 25px;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            background: var(--azul-oscuro);
            color: var(--amarillo);
            cursor: pointer;
            font-size: 1.2em;
            letter-spacing: 1px;
            width: 50%;
            align-self: center;
            text-align: center;
            transition: background 0.2s, color 0.2s;
        }

        button:hover {
            background: #0d133d;
            color: #fffde7;
        }

        footer {
            text-align: center;
            padding: 18px;
            border-top: 2px solid var(--gris-borde);
            margin-top: 0;
            background: var(--amarillo);
            color: var(--azul-oscuro);
            font-size: 1.1em;
            width: 100%;
        }

        /* Bloque explicativo */
        .explicacion {
            width: 80%;
            max-width: 700px;
            margin-bottom: 30px;
            text-align: left;
            font-size: 1.15em;
            background: var(--gris);
            border-left: 8px solid var(--azul-oscuro);
            padding: 18px 22px;
            border-radius: 10px;
            color: var(--azul-oscuro);
        }

        @media (max-width: 900px) {

            .explicacion,
            form {
                max-width: 95vw;
            }

            label,
            input[type="file"],
            input[type="text"],
            textarea,
            button {
                max-width: 95vw;
            }
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 15px;
            background: var(--azul-oscuro);
            padding: 12px 0;
            border-top: 2px solid var(--gris-borde);
            border-bottom: 2px solid var(--gris-borde);
        }

        .menu a {
            color: var(--amarillo);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: color 0.2s, border-bottom 0.2s;
            padding: 6px 10px;
        }

        .menu a:hover {
            color: #fffde7;
            border-bottom: 3px solid var(--amarillo);
        }
    </style>
</head>

<body>

    <header>
        <img src="C:\Users\57304\Desktop\3dumakers\WhatsApp Image 2025-09-26 at 2.24.53 PM.jpeg" alt="Logo 3DUMAKERS"
            width="200" height="auto">

        <h1 style="margin:6px 0 0 0; font-size:0.95rem">IMPRIME EL JUEGO — CONSTRUYE EL CONOCIMIENTO</h1>
    </header>
    <header>


        <!-- 🔽 Menú de navegación -->
        <nav class="menu">
            <a href="inicio.html">Que hacemos?</a>
            <a href="quienes.html">Quienes somos</a>
            <a href="materiales.html">Materiales didácticos que podemos realizar</a>
            <a href="aliados.html">Sé nuestro aliado</a>
            <a href="contacto.html">Contáctanos</a>
        </nav>
    </header>


    <div class="container">
        <!-- Explicación del proceso de refilamentación -->

        <!-- Texto explicativo antes del formulario -->


        <form>
            <!-- Subir imagen -->
            <label for="image">Sube tus imágenes 2D para cotizar tu proyecto:</label>
            <input type="file" id="image" name="image" accept="image/*">

            <!-- Tamaño de la figura -->
            <label for="height">Digite las características del proyecto:</label>

            <label for="height">Altura (cm):</label>
            <input type="text" id="height" name="height" placeholder="Ejemplo: 100">

            <label for="width">Anchura (cm):</label>
            <input type="text" id="width" name="width" placeholder="Ejemplo: 80">

            <label for="length">Largo (cm):</label>
            <input type="text" id="length" name="length" placeholder="Ejemplo: 50">

            <!-- Correo electrónico -->
            <label for="email">Correo electrónico para enviar la cotización:</label>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>

            <!-- Comentarios -->
            <label for="comments">Características del producto:</label>
            <textarea id="comments" name="comments"
                placeholder="Describe las características, colores, si tienen algún detalle especial como un logo, etc."></textarea>

            <!-- Botón -->
            <button type="submit">Enviar solicitud</button>
        </form>
    </div>

    <footer>
        <p>© 2025 3DUMAKERS - Eco-friendly 3D Innovation </p>
    </footer>

</body>

</html>
